[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-purge"
version = "0.1.0"
description = "Fully local-first Google Photos cleanup, classification, and deduplication engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishnu" }]

# Phase 1 keeps the dependency surface lean: ingestion + hierarchical dedup only.
# Vision/face (Module C) and cloud-free delta (Module E) deps are added in later phases.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
    "imagehash>=4.3",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
# Heavy / platform-specific decoders. Installed on demand; ingestion degrades
# gracefully when they are absent (see ingestion.decode).
heic = ["pillow-heif>=0.16"]
raw = ["rawpy>=0.21"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
pixel-purge = "core_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"core_engine" = ["schema.sql"]
